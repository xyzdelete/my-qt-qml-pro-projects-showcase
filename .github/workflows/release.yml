name: release

on:
  push:
    tags:
      - '*-v*-release'

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BASELINE: 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4

jobs:
  host-x64-windows-target-x64-windows-static-release:
    name: host-x64-windows-target-x64-windows-static-release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - name: Report CMake version
        run: cmake --version
      - name: Report CPack version
        run: cpack --version
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Report MSVC compiler
        run: |
          $compiler = Get-Command cl.exe -ErrorAction Stop
          Write-Output "MSVC compiler: $($compiler.Source)"
          & $compiler.Source 2>&1 | Select-Object -First 2
      - name: Install NSIS and verify packaging tools
        run: |
          choco --version
          choco install nsis --no-progress --yes
          $nsisPath = "${env:ProgramFiles(x86)}/NSIS"
          if (-not (Test-Path "$nsisPath/makensis.exe")) { throw "NSIS was not found at $nsisPath" }
          $env:Path = "$nsisPath;$env:Path"
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          makensis /VERSION
      - name: Install vcpkg
        run: |
          # Short root-level path avoids MAX_PATH (260) failures deep in qtdeclarative's nested sources
          $vcpkgRoot = "D:/vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone vcpkg into $vcpkgRoot" }
          git -C $vcpkgRoot checkout $env:VCPKG_BASELINE
          if ($LASTEXITCODE -ne 0) { throw "Failed to check out vcpkg baseline $env:VCPKG_BASELINE" }
          & "$vcpkgRoot/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "Failed to bootstrap vcpkg" }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$vcpkgRoot/vcpkg.exe" version
      - name: Configure and build
        env:
          VCPKG_INSTALLED_ROOT: D:/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: D:/vcpkg-buildtrees
        run: |
          $env:BUILD_ROOT = "D:/build"
          cmake --preset host-x64-windows-target-x64-windows-static-release
          cmake --build --preset host-x64-windows-target-x64-windows-static-release-build --parallel
      - name: Package NSIS and ZIP
        run: |
          $build = "D:/build/host-x64-windows-target-x64-windows-static-release"
          cmake --install $build --config Release
          cpack --config "$build/CPackConfig.cmake" -C Release
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-x64-windows-static-release
          path: |
            D:/build/host-x64-windows-target-x64-windows-static-release/*.zip
            D:/build/host-x64-windows-target-x64-windows-static-release/*.exe
          if-no-files-found: error

  host-arm64-osx-target-arm64-osx-release:
    name: host-arm64-osx-target-arm64-osx-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - name: Report CMake version
        run: cmake --version
      - name: Report CPack version
        run: cpack --version
      - name: Report Apple Clang compiler
        run: |
          clang --version
          clang++ --version
      - name: Install macOS build prerequisites
        run: |
          brew install autoconf autoconf-archive automake libtool ninja
          libtool_bin="$(brew --prefix libtool)/libexec/gnubin"
          export PATH="$libtool_bin:$PATH"
          echo "$libtool_bin" >> "$GITHUB_PATH"
          autoconf --version
          automake --version
          libtoolize --version
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vcpkg/vcpkg" version
      - name: Configure and build
        env:
          BUILD_ROOT: ${{ runner.temp }}/build
          VCPKG_INSTALLED_ROOT: ${{ runner.temp }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ runner.temp }}/vcpkg-buildtrees
        run: |
          cmake --preset host-arm64-osx-target-arm64-osx-release
          cmake --build --preset host-arm64-osx-target-arm64-osx-release-build --parallel
      - name: Optionally sign macOS app
        env:
          APPLE_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_MACOS_SIGNING_IDENTITY: ${{ secrets.APPLE_MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/build/host-arm64-osx-target-arm64-osx-release"
          cmake --install "$build" --config Release
          app="$build/install/DemoApp.app"
          if [[ -z "${APPLE_MACOS_CERTIFICATE_P12_BASE64:-}" || -z "${APPLE_CERTIFICATE_PASSWORD:-}" || -z "${APPLE_MACOS_SIGNING_IDENTITY:-}" ]]; then
            echo "Apple macOS signing secrets are incomplete; leaving the app unsigned."
            exit 0
          fi
          certificate="$RUNNER_TEMP/macos-signing.p12"
          keychain="$RUNNER_TEMP/macos-signing.keychain-db"
          printf '%s' "$APPLE_MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          codesign --deep --force --verbose --options runtime --timestamp \
            --sign "$APPLE_MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Package DragNDrop and TGZ
        run: |
          build="$RUNNER_TEMP/build/host-arm64-osx-target-arm64-osx-release"
          cpack --config "$build/CPackConfig.cmake" -C Release
      - name: Optionally notarize macOS DMG
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_MACOS_SIGNING_IDENTITY: ${{ secrets.APPLE_MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/build/host-arm64-osx-target-arm64-osx-release"
          if [[ -z "${APPLE_NOTARY_KEY_ID:-}" || -z "${APPLE_NOTARY_ISSUER_ID:-}" || -z "${APPLE_NOTARY_PRIVATE_KEY_BASE64:-}" || -z "${APPLE_MACOS_CERTIFICATE_P12_BASE64:-}" || -z "${APPLE_CERTIFICATE_PASSWORD:-}" || -z "${APPLE_MACOS_SIGNING_IDENTITY:-}" ]]; then
            echo "Apple signing or notarization secrets are incomplete; leaving the DMG unstapled."
            exit 0
          fi
          key="$RUNNER_TEMP/apple-notary-key.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$key"
          dmg="$(find "$build" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "No macOS DMG was produced for notarization." >&2
            exit 1
          fi
          xcrun notarytool submit "$dmg" --key "$key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-arm64-osx-release
          path: |
            ${{ runner.temp }}/build/host-arm64-osx-target-arm64-osx-release/*.dmg
            ${{ runner.temp }}/build/host-arm64-osx-target-arm64-osx-release/*.tar.gz
          if-no-files-found: error

  host-arm64-osx-target-arm64-ios-simulator-release:
    name: host-arm64-osx-target-arm64-ios-simulator-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - name: Report Apple SDK and compiler
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          clang --version
          clang++ --version
      - name: Install iOS build prerequisites
        run: |
          brew install autoconf autoconf-archive automake libtool ninja
          libtool_bin="$(brew --prefix libtool)/libexec/gnubin"
          export PATH="$libtool_bin:$PATH"
          echo "$libtool_bin" >> "$GITHUB_PATH"
          autoconf --version
          automake --version
          libtoolize --version
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vcpkg/vcpkg" version
      - name: Configure and build unsigned simulator app
        env:
          BUILD_ROOT: ${{ runner.temp }}/build
          VCPKG_INSTALLED_ROOT: ${{ runner.temp }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ runner.temp }}/vcpkg-buildtrees
        run: |
          cmake --preset host-arm64-osx-target-arm64-ios-simulator-release
          cmake --build --preset host-arm64-osx-target-arm64-ios-simulator-release-build --parallel
      - name: Package simulator app
        run: |
          build="$RUNNER_TEMP/build/host-arm64-osx-target-arm64-ios-simulator-release"
          cmake --install "$build" --config Release
          app="$build/install/DemoApp.app"
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$build/${{ github.ref_name }}-arm64-ios-simulator-release.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-arm64-ios-simulator-release
          path: ${{ runner.temp }}/build/host-arm64-osx-target-arm64-ios-simulator-release/${{ github.ref_name }}-arm64-ios-simulator-release.zip
          if-no-files-found: error

  host-arm64-osx-target-arm64-ios-release:
    name: host-arm64-osx-target-arm64-ios-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - name: Report iOS SDK and compiler
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          clang --version
          clang++ --version
      - name: Install iOS build prerequisites
        run: |
          brew install autoconf autoconf-archive automake libtool ninja
          libtool_bin="$(brew --prefix libtool)/libexec/gnubin"
          export PATH="$libtool_bin:$PATH"
          echo "$libtool_bin" >> "$GITHUB_PATH"
          autoconf --version
          automake --version
          libtoolize --version
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vcpkg/vcpkg" version
      - name: Configure Xcode device project
        env:
          BUILD_ROOT: ${{ runner.temp }}/build
          VCPKG_INSTALLED_ROOT: ${{ runner.temp }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ runner.temp }}/vcpkg-buildtrees
        run: cmake --preset host-arm64-osx-target-arm64-ios-release
      - name: Archive device app and optionally export IPA
        env:
          APPLE_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_IOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_IOS_SIGNING_IDENTITY: ${{ secrets.APPLE_IOS_SIGNING_IDENTITY }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_IOS_EXPORT_METHOD: ${{ secrets.APPLE_IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/build/host-arm64-osx-target-arm64-ios-release"
          archive="$build/${{ github.ref_name }}-arm64-ios-release.xcarchive"
          certificate="$RUNNER_TEMP/ios-signing.p12"
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          profile="$RUNNER_TEMP/ios-profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/ios-profile.plist"
          signing_enabled=false

          if [[ -n "${APPLE_IOS_CERTIFICATE_P12_BASE64:-}" && -n "${APPLE_CERTIFICATE_PASSWORD:-}" && -n "${APPLE_IOS_SIGNING_IDENTITY:-}" && -n "${APPLE_DEVELOPMENT_TEAM:-}" && -n "${APPLE_IOS_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            signing_enabled=true
            printf '%s' "$APPLE_IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
            printf '%s' "$APPLE_IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
            security create-keychain -p "" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "" "$keychain"
            security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security list-keychains -d user -s "$keychain"
            security default-keychain -s "$keychain"
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            security cms -D -i "$profile" -o "$profile_plist"
            profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
            profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
            cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          else
            echo "iOS signing secrets are incomplete; creating an unsigned device archive."
          fi

          xcode_projects=("$build"/*.xcodeproj)
          if [[ ${#xcode_projects[@]} -ne 1 || ! -d "${xcode_projects[0]}" ]]; then
            echo "Expected exactly one Xcode project in $build, found ${#xcode_projects[@]}." >&2
            exit 1
          fi
          xcodebuild_args=(
            -project "${xcode_projects[0]}"
            -scheme DemoApp
            -configuration Release
            -sdk iphoneos
            -destination "generic/platform=iOS"
            -archivePath "$archive"
          )
          if [[ "$signing_enabled" == true ]]; then
            xcodebuild_args+=(
              DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM"
              CODE_SIGN_STYLE=Manual
              CODE_SIGN_IDENTITY="$APPLE_IOS_SIGNING_IDENTITY"
              PROVISIONING_PROFILE_SPECIFIER="$profile_name"
            )
          else
            xcodebuild_args+=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          fi
          xcodebuild "${xcodebuild_args[@]}" archive

          mkdir -p "$build/release-artifacts"
          ditto -c -k --sequesterRsrc --keepParent "$archive" \
            "$build/release-artifacts/${{ github.ref_name }}-arm64-ios-release.xcarchive.zip"

          if [[ "$signing_enabled" == true ]]; then
            export_options="$RUNNER_TEMP/ios-export-options.plist"
            export_method="${APPLE_IOS_EXPORT_METHOD:-development}"
            cat > "$export_options" <<EOF
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
              <key>method</key>
              <string>$export_method</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>$APPLE_DEVELOPMENT_TEAM</string>
              <key>provisioningProfiles</key>
              <dict>
                <key>com.github.xyzdelete.DemoApp</key>
                <string>$profile_name</string>
              </dict>
            </dict>
            </plist>
            EOF
            xcodebuild -exportArchive -archivePath "$archive" \
              -exportOptionsPlist "$export_options" \
              -exportPath "$build/release-artifacts"
            mv "$build/release-artifacts/DemoApp.ipa" \
              "$build/release-artifacts/${{ github.ref_name }}-arm64-ios-release.ipa"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-arm64-ios-release
          path: ${{ runner.temp }}/build/host-arm64-osx-target-arm64-ios-release/release-artifacts/*
          if-no-files-found: error

  host-x64-linux-target-x64-linux-release:
    name: host-x64-linux-target-x64-linux-release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - name: Report CMake version
        run: cmake --version
      - name: Report CPack version
        run: cpack --version
      - name: Install Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf autoconf-archive automake build-essential curl file gcc g++ libegl1-mesa-dev libglu1-mesa-dev libice-dev libltdl-dev libsm-dev libtool libx11-xcb-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libxrender-dev ninja-build patchelf '^libxcb.*-dev'
      - name: Report GCC compiler
        run: |
          gcc --version
          g++ --version
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vcpkg/vcpkg" version
      - name: Configure and build
        env:
          BUILD_ROOT: ${{ runner.temp }}/build
          VCPKG_INSTALLED_ROOT: ${{ runner.temp }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ runner.temp }}/vcpkg-buildtrees
        run: |
          cmake --preset host-x64-linux-target-x64-linux-release
          cmake --build --preset host-x64-linux-target-x64-linux-release-build --parallel
      - name: Package DEB and TGZ
        run: |
          build="$RUNNER_TEMP/build/host-x64-linux-target-x64-linux-release"
          cmake --install "$build" --config Release
          cpack --config "$build/CPackConfig.cmake" -C Release
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-x64-linux-release
          path: |
            ${{ runner.temp }}/build/host-x64-linux-target-x64-linux-release/*.deb
            ${{ runner.temp }}/build/host-x64-linux-target-x64-linux-release/*.tar.gz
          if-no-files-found: error

