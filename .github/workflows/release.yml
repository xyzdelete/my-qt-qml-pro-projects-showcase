name: release

on:
  push:
    tags:
      - 'tag-*-release-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_NAME: Qt6QmlForBeginners
  VCPKG_BASELINE: ea1a7396b05637a53bf23c078647ecc0edee4b80

jobs:
  release-metadata:
    name: release-metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - id: extract-version
        name: Extract release version
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$REF_NAME" =~ ^tag-(.+)-release-(v[^[:space:]]+)$ ]]; then
            echo "Regex matched: ${BASH_REMATCH[0]}"
            echo "Captured project name: ${BASH_REMATCH[1]}"
            echo "Captured version: ${BASH_REMATCH[2]}"
            project_name="${BASH_REMATCH[1]}"
            if [[ "$project_name" == -* || "$project_name" == *- || "$project_name" == *--* ]]; then
              echo "Invalid project name in release ref: $REF_NAME" >&2
              exit 1
            fi
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "version=latest" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported release ref: $REF_NAME" >&2
            exit 1
          fi

  host-x64-windows-target-x64-windows-static:
    name: host-x64-windows-target-x64-windows-static
    needs: release-metadata
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Report MSVC compiler
        run: |
          $compiler = Get-Command cl.exe -ErrorAction Stop
          Write-Output "MSVC compiler: $($compiler.Source)"
          & $compiler.Source 2>&1 | Select-Object -First 2
      - name: Install NSIS and verify packaging tools
        run: |
          choco --version
          choco install nsis --no-progress --yes
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsisPath\makensis.exe")) { throw "NSIS was not found at $nsisPath" }
          $env:Path = "$nsisPath;$env:Path"
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          cmake --version
          cpack --version
          makensis /VERSION
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout $env:VCPKG_BASELINE
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" version
      - name: Configure and build
        env:
          VCPKG_INSTALLED_ROOT: ${{ runner.temp }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ runner.temp }}/vcpkg-buildtrees
        run: |
          $env:BUILD_ROOT = "$env:RUNNER_TEMP\build"
          cmake --preset host-x64-windows-target-x64-windows-static
          cmake --build --preset host-x64-windows-target-x64-windows-static-release
      - name: Package
        run: |
          $build = "$env:RUNNER_TEMP\build\host-x64-windows-target-x64-windows-static"
          cmake --install $build --config Release
          cpack --config Release --working-directory $build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ needs.release-metadata.outputs.version }}-x64-windows
          path: |
            ${{ runner.temp }}/build/host-x64-windows-target-x64-windows-static/*.zip
            ${{ runner.temp }}/build/host-x64-windows-target-x64-windows-static/*.exe
          if-no-files-found: error

  host-arm64-osx-target-arm64-osx:
    name: host-arm64-osx-target-arm64-osx
    needs: release-metadata
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Report Clang compiler
        run: |
          clang --version
          clang++ --version
      - name: Install macOS build prerequisites
        run: |
          brew install autoconf autoconf-archive automake libtool
          libtool_bin="$(brew --prefix libtool)/libexec/gnubin"
          export PATH="$libtool_bin:$PATH"
          echo "$libtool_bin" >> "$GITHUB_PATH"
          autoconf --version
          automake --version
          libtoolize --version
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vcpkg/vcpkg" version
          cmake --version
          cpack --version
      - name: Configure and build
        env:
          BUILD_ROOT: ${{ runner.temp }}/build
          VCPKG_INSTALLED_ROOT: ${{ runner.temp }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ runner.temp }}/vcpkg-buildtrees
        run: |
          cmake --preset host-arm64-osx-target-arm64-osx
          cmake --build --preset host-arm64-osx-target-arm64-osx-release
      - name: Package
        run: |
          build="$RUNNER_TEMP/build/host-arm64-osx-target-arm64-osx"
          cmake --install "$build" --config Release
          cpack --config Release --working-directory "$build"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ needs.release-metadata.outputs.version }}-arm64-macos
          path: |
            ${{ runner.temp }}/build/host-arm64-osx-target-arm64-osx/*.dmg
            ${{ runner.temp }}/build/host-arm64-osx-target-arm64-osx/*.tar.gz
          if-no-files-found: error

  host-x64-linux-target-x64-linux:
    name: host-x64-linux-target-x64-linux
    needs: release-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Report GCC compiler
        run: |
          gcc --version
          g++ --version
      - name: Install Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf autoconf-archive automake build-essential curl file libegl1-mesa-dev libglu1-mesa-dev libice-dev libltdl-dev libsm-dev libtool libx11-xcb-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libxrender-dev ninja-build patchelf '^libxcb.*-dev'
          cmake --version
          cpack --version
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vcpkg/vcpkg" version
      - name: Configure and build
        env:
          BUILD_ROOT: ${{ runner.temp }}/build
          VCPKG_INSTALLED_ROOT: ${{ runner.temp }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ runner.temp }}/vcpkg-buildtrees
        run: |
          cmake --preset host-x64-linux-target-x64-linux
          cmake --build --preset host-x64-linux-target-x64-linux-release
      - name: Package DEB and TGZ
        run: |
          build="$RUNNER_TEMP/build/host-x64-linux-target-x64-linux"
          cmake --install "$build" --config Release
          cpack --config Release --working-directory "$build"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ needs.release-metadata.outputs.version }}-x64-linux
          path: |
            ${{ runner.temp }}/build/host-x64-linux-target-x64-linux/*.deb
            ${{ runner.temp }}/build/host-x64-linux-target-x64-linux/*.tar.gz
          if-no-files-found: error

  host-x64-linux-target-arm64-linux:
    name: host-x64-linux-target-arm64-linux
    needs: release-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install arm64 cross compiler
        run: |
          sudo dpkg --add-architecture arm64
          # Ubuntu's regular mirrors do not publish arm64 indexes; use ports for foreign packages.
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources > /dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install --yes autoconf autoconf-archive automake dpkg-dev file gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libegl1-mesa-dev libglu1-mesa-dev libice-dev libltdl-dev libsm-dev libtool libx11-xcb-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libxrender-dev ninja-build '^libxcb.*-dev'
          sudo apt-get install --yes libegl1-mesa-dev:arm64 libglu1-mesa-dev:arm64 libice-dev:arm64 libsm-dev:arm64 libx11-xcb-dev:arm64 libxi-dev:arm64 libxkbcommon-dev:arm64 libxkbcommon-x11-dev:arm64 libxrender-dev:arm64 '^libxcb.*-dev:arm64'
          cmake --version
          cpack --version
      - name: Report arm64 cross compiler
        run: |
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-g++ --version
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vcpkg/vcpkg" version
      - name: Configure and build
        env:
          BUILD_ROOT: ${{ runner.temp }}/build
          VCPKG_INSTALLED_ROOT: ${{ runner.temp }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ runner.temp }}/vcpkg-buildtrees
        run: |
          cmake --preset host-x64-linux-target-arm64-linux
          cmake --build --preset host-x64-linux-target-arm64-linux-release
      - name: Package arm64 DEB and TGZ
        run: |
          build="$RUNNER_TEMP/build/host-x64-linux-target-arm64-linux"
          cmake --install "$build" --config Release
          cpack --config Release -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=OFF --working-directory "$build"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ needs.release-metadata.outputs.version }}-arm64-linux
          path: |
            ${{ runner.temp }}/build/host-x64-linux-target-arm64-linux/*.deb
            ${{ runner.temp }}/build/host-x64-linux-target-arm64-linux/*.tar.gz
          if-no-files-found: error

  host-x64-windows-target-arm64-android:
    name: host-x64-windows-target-arm64-android
    needs: release-metadata
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Report MSVC compiler
        run: |
          $compiler = Get-Command cl.exe -ErrorAction Stop
          Write-Output "MSVC compiler: $($compiler.Source)"
          & $compiler.Source 2>&1 | Select-Object -First 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;27.3.13750724"
          "ANDROID_NDK_HOME=$env:ANDROID_HOME\ndk\27.3.13750724" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          java -version
          sdkmanager --version
          adb version
          & "$env:ANDROID_HOME\ndk\27.3.13750724\ndk-build.cmd" --version
      - name: Report Android ARM64 cross compiler
        run: |
          $toolchainBin = "$env:ANDROID_NDK_HOME\toolchains\llvm\prebuilt\windows-x86_64\bin"
          $crossCompiler = Join-Path $toolchainBin "aarch64-linux-android35-clang++.cmd"
          $clangCompiler = Join-Path $toolchainBin "clang++.exe"
          if (-not (Test-Path $crossCompiler)) { throw "Android ARM64 cross compiler was not found at $crossCompiler" }
          if (-not (Test-Path $clangCompiler)) { throw "Android NDK Clang++ was not found at $clangCompiler" }
          Write-Output "Android ARM64 cross compiler: $crossCompiler"
          & $crossCompiler --version
          Write-Output "Android NDK Clang++: $clangCompiler"
          & $clangCompiler --version
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout $env:VCPKG_BASELINE
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" version
          cmake --version
          cpack --version
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) { throw 'ANDROID_KEYSTORE_BASE64 is required' }
          New-Item -ItemType Directory -Force .android-keystore | Out-Null
          [IO.File]::WriteAllBytes('.android-keystore\aa-android-release-sign-keystore.jks', [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
      - name: Configure and build APK/AAB
        env:
          BUILD_ROOT: ${{ runner.temp }}/build
          VCPKG_INSTALLED_ROOT: ${{ runner.temp }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ runner.temp }}/vcpkg-buildtrees
        run: |
          cmake --preset host-x64-windows-target-arm64-android
          cmake --build --preset host-x64-windows-target-arm64-android-release --target apk
          cmake --build --preset host-x64-windows-target-arm64-android-release --target aab
      - name: Align and sign release artifacts
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_PASSWORD)) { throw 'ANDROID_KEYSTORE_PASSWORD is required' }
          $build = "$env:RUNNER_TEMP\build\host-x64-windows-target-arm64-android"
          cmake --build "$build" --config Release --target android_align_and_sign
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ needs.release-metadata.outputs.version }}-arm64-android
          path: ${{ runner.temp }}/build/host-x64-windows-target-arm64-android/android-build/signed/*
          if-no-files-found: error

  host-x64-windows-target-wasm32-emscripten:
    name: host-x64-windows-target-wasm32-emscripten
    needs: release-metadata
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Report MSVC compiler
        run: |
          $compiler = Get-Command cl.exe -ErrorAction Stop
          Write-Output "MSVC compiler: $($compiler.Source)"
          & $compiler.Source 2>&1 | Select-Object -First 2
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7
          actions-cache-folder: emsdk-cache
      - name: Report Emscripten compiler
        run: |
          emcc --version
          em++ --version
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout $env:VCPKG_BASELINE
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EMSCRIPTEN_ROOT=$env:EMSDK\upstream\emscripten" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" version
          cmake --version
          cpack --version
      - name: Configure and build
        env:
          BUILD_ROOT: ${{ runner.temp }}/build
          VCPKG_INSTALLED_ROOT: ${{ runner.temp }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ runner.temp }}/vcpkg-buildtrees
        run: |
          cmake --preset host-x64-windows-target-wasm32-emscripten
          cmake --build --preset host-x64-windows-target-wasm32-emscripten-release
          $build = "$env:RUNNER_TEMP\build\host-x64-windows-target-wasm32-emscripten"
          cmake --install $build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ needs.release-metadata.outputs.version }}-wasm32-emscripten
          path: ${{ runner.temp }}/build/host-x64-windows-target-wasm32-emscripten/install/bin/*
          if-no-files-found: error