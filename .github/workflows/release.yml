name: release

on:
  push:
    tags:
      - '*-release-v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BASELINE: 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4

jobs:
  host-x64-windows-target-x64-windows-static-release:
    name: host-x64-windows-target-x64-windows-static-release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Report MSVC compiler
        run: |
          $compiler = Get-Command cl.exe -ErrorAction Stop
          Write-Output "MSVC compiler: $($compiler.Source)"
          & $compiler.Source 2>&1 | Select-Object -First 2
      - name: Install NSIS and verify packaging tools
        run: |
          choco --version
          choco install nsis --no-progress --yes
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsisPath\makensis.exe")) { throw "NSIS was not found at $nsisPath" }
          $env:Path = "$nsisPath;$env:Path"
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          cmake --version
          cpack --version
          makensis /VERSION
      - name: Install vcpkg
        run: |
          # Short root-level path avoids MAX_PATH (260) failures deep in qtdeclarative's nested sources
          git clone https://github.com/microsoft/vcpkg.git "C:\vcpkg"
          git -C "C:\vcpkg" checkout $env:VCPKG_BASELINE
          & "C:\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "C:\vcpkg\vcpkg.exe" version
      - name: Configure and build
        env:
          VCPKG_INSTALLED_ROOT: C:\vi
          VCPKG_BUILDTREES_ROOT: C:\vb
        run: |
          $env:BUILD_ROOT = "C:\b"
          cmake --preset host-x64-windows-target-x64-windows-static-release
          cmake --build --preset host-x64-windows-target-x64-windows-static-release-build --parallel
      - name: Locate CPack config
        id: cpackcfg
        run: |
          $build = "C:\b\host-x64-windows-target-x64-windows-static-release"
          $cfg = Get-ChildItem -Path $build -File -Recurse -Filter CPackConfig.cmake | Select-Object -First 1
          if (-not $cfg) { throw "CPackConfig.cmake not found under $build" }
          Write-Output "Found CPack config: $($cfg.FullName)"
          "cfg=$($cfg.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Package NSIS and ZIP
        run: |
          cmake --install "C:\b\host-x64-windows-target-x64-windows-static-release" --config Release
          cpack --config "${{ steps.cpackcfg.outputs.cfg }}" -C Release
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-x64-windows
          path: |
            C:\b\host-x64-windows-target-x64-windows-static-release\*.zip
            C:\b\host-x64-windows-target-x64-windows-static-release\*.exe
          if-no-files-found: error

  host-arm64-osx-target-arm64-osx-release:
    name: host-arm64-osx-target-arm64-osx-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - name: Report Apple Clang compiler
        run: |
          clang --version
          clang++ --version
      - name: Install macOS build prerequisites
        run: |
          brew install autoconf autoconf-archive automake libtool
          libtool_bin="$(brew --prefix libtool)/libexec/gnubin"
          export PATH="$libtool_bin:$PATH"
          echo "$libtool_bin" >> "$GITHUB_PATH"
          autoconf --version
          automake --version
          libtoolize --version
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vcpkg/vcpkg" version
          cmake --version
          cpack --version
      - name: Configure and build
        env:
          BUILD_ROOT: ${{ runner.temp }}/build
          VCPKG_INSTALLED_ROOT: ${{ runner.temp }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ runner.temp }}/vcpkg-buildtrees
        run: |
          cmake --preset host-arm64-osx-target-arm64-osx-release
          cmake --build --preset host-arm64-osx-target-arm64-osx-release-build --parallel
      - name: Locate CPack config
        id: cpackcfg
        run: |
          build="$RUNNER_TEMP/build/host-arm64-osx-target-arm64-osx-release"
          cfg="$(find "$build" -type f -name 'CPackConfig.cmake' | head -n 1)"
          if [ -z "$cfg" ]; then
            echo "CPackConfig.cmake not found under $build"
            exit 1
          fi
          echo "Found CPack config: $cfg"
          echo "cfg=$cfg" >> "$GITHUB_OUTPUT"
      - name: Package DragNDrop and TGZ
        run: |
          cmake --install "$RUNNER_TEMP/build/host-arm64-osx-target-arm64-osx-release" --config Release
          cpack --config "${{ steps.cpackcfg.outputs.cfg }}" -C Release
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-arm64-macos
          path: |
            ${{ runner.temp }}/build/host-arm64-osx-target-arm64-osx-release/*.dmg
            ${{ runner.temp }}/build/host-arm64-osx-target-arm64-osx-release/*.tar.gz
          if-no-files-found: error

  host-x64-linux-target-x64-linux-release:
    name: host-x64-linux-target-x64-linux-release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - name: Install Linux tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf autoconf-archive automake build-essential curl file gcc g++ libegl1-mesa-dev libglu1-mesa-dev libice-dev libltdl-dev libsm-dev libtool libx11-xcb-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libxrender-dev ninja-build patchelf '^libxcb.*-dev'
          cmake --version
          cpack --version
      - name: Report GCC compiler
        run: |
          gcc --version
          g++ --version
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vcpkg/vcpkg" version
      - name: Configure and build
        env:
          BUILD_ROOT: ${{ runner.temp }}/build
          VCPKG_INSTALLED_ROOT: ${{ runner.temp }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ runner.temp }}/vcpkg-buildtrees
        run: |
          cmake --preset host-x64-linux-target-x64-linux-release
          cmake --build --preset host-x64-linux-target-x64-linux-release-build --parallel
      - name: Locate CPack config
        id: cpackcfg
        run: |
          build="$RUNNER_TEMP/build/host-x64-linux-target-x64-linux-release"
          cfg="$(find "$build" -type f -name 'CPackConfig.cmake' | head -n 1)"
          if [ -z "$cfg" ]; then
            echo "CPackConfig.cmake not found under $build"
            exit 1
          fi
          echo "Found CPack config: $cfg"
          echo "cfg=$cfg" >> "$GITHUB_OUTPUT"
      - name: Package DEB and TGZ
        run: |
          cmake --install "$RUNNER_TEMP/build/host-x64-linux-target-x64-linux-release" --config Release
          cpack --config "${{ steps.cpackcfg.outputs.cfg }}" -C Release
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-x64-linux
          path: |
            ${{ runner.temp }}/build/host-x64-linux-target-x64-linux-release/*.deb
            ${{ runner.temp }}/build/host-x64-linux-target-x64-linux-release/*.tar.gz
          if-no-files-found: error

  host-x64-linux-target-arm64-linux-release:
    name: host-x64-linux-target-arm64-linux-release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - name: Install ARM64 cross compiler
        run: |
          sudo dpkg --add-architecture arm64
          # Ubuntu's regular mirrors do not publish arm64 indexes; use ports for foreign packages.
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          . /etc/os-release
          sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources > /dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: $VERSION_CODENAME $VERSION_CODENAME-updates $VERSION_CODENAME-backports $VERSION_CODENAME-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install --yes --allow-downgrades autoconf autoconf-archive automake dpkg-dev file gcc:amd64 g++:amd64 gcc-aarch64-linux-gnu:amd64 g++-aarch64-linux-gnu:amd64 libegl1-mesa-dev:amd64 libglu1-mesa-dev:amd64 libice-dev:amd64 libltdl-dev:amd64 libsm-dev:amd64 libtool ninja-build libx11-xcb-dev:amd64 libxi-dev:amd64 libxkbcommon-dev:amd64 libxkbcommon-x11-dev:amd64 libxrender-dev:amd64 '^libxcb.*-dev:amd64' ninja-build:amd64
          sudo apt-get install --yes --allow-downgrades libegl1-mesa-dev:arm64 libglu1-mesa-dev:arm64 libice-dev:arm64 libltdl-dev:arm64 libsm-dev:arm64 libx11-xcb-dev:arm64 libxi-dev:arm64 libxkbcommon-dev:arm64 libxkbcommon-x11-dev:arm64 libxrender-dev:arm64 pkgconf:arm64 pkg-config:arm64 '^libxcb.*-dev:arm64' ninja-build:arm64
          cmake --version
          cpack --version
      - name: Report GCC compiler
        run: |
          gcc --version
          g++ --version
      - name: Report GCC ARM64 cross compiler
        run: |
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-g++ --version
          aarch64-linux-gnu-pkg-config --version
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vcpkg/vcpkg" version
      - name: Configure and build
        env:
          BUILD_ROOT: ${{ runner.temp }}/build
          VCPKG_INSTALLED_ROOT: ${{ runner.temp }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ runner.temp }}/vcpkg-buildtrees
        run: |
          cmake --preset host-x64-linux-target-arm64-linux-release
          cmake --build --preset host-x64-linux-target-arm64-linux-release-build --parallel
      - name: Locate CPack config
        id: cpackcfg
        run: |
          build="$RUNNER_TEMP/build/host-x64-linux-target-arm64-linux-release"
          cfg="$(find "$build" -type f -name 'CPackConfig.cmake' | head -n 1)"
          if [ -z "$cfg" ]; then
            echo "CPackConfig.cmake not found under $build"
            exit 1
          fi
          echo "Found CPack config: $cfg"
          echo "cfg=$cfg" >> "$GITHUB_OUTPUT"
      - name: Package ARM64 DEB and TGZ
        run: |
          cmake --install "$RUNNER_TEMP/build/host-x64-linux-target-arm64-linux-release" --config Release
          cpack --config "${{ steps.cpackcfg.outputs.cfg }}" -C Release -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=OFF
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-arm64-linux
          path: |
            ${{ runner.temp }}/build/host-x64-linux-target-arm64-linux-release/*.deb
            ${{ runner.temp }}/build/host-x64-linux-target-arm64-linux-release/*.tar.gz
          if-no-files-found: error

  host-x64-windows-target-arm64-android-release:
    name: host-x64-windows-target-arm64-android-release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Report MSVC compiler
        run: |
          $compiler = Get-Command cl.exe -ErrorAction Stop
          Write-Output "MSVC compiler: $($compiler.Source)"
          & $compiler.Source 2>&1 | Select-Object -First 2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;27.3.13750724"
          "ANDROID_NDK_HOME=$env:ANDROID_HOME\ndk\27.3.13750724" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          java -version
          sdkmanager --version
          adb version
          & "$env:ANDROID_HOME\ndk\27.3.13750724\ndk-build.cmd" --version
      - name: Report Android NDK Clang ARM64 cross compiler
        run: |
          $toolchainBin = "$env:ANDROID_NDK_HOME\toolchains\llvm\prebuilt\windows-x86_64\bin"
          $crossCompiler = Join-Path $toolchainBin "aarch64-linux-android35-clang++.cmd"
          $clangCompiler = Join-Path $toolchainBin "clang++.exe"
          if (-not (Test-Path $crossCompiler)) { throw "Android NDK Clang ARM64 cross compiler was not found at $crossCompiler" }
          if (-not (Test-Path $clangCompiler)) { throw "Android NDK Clang compiler was not found at $clangCompiler" }
          Write-Output "Android NDK Clang ARM64 cross compiler: $crossCompiler"
          & $crossCompiler --version
          Write-Output "Android NDK Clang compiler: $clangCompiler"
          & $clangCompiler --version
      - name: Install vcpkg
        run: |
          # Short root-level path avoids MAX_PATH (260) failures deep in qtdeclarative's nested sources
          git clone https://github.com/microsoft/vcpkg.git "C:\vcpkg"
          git -C "C:\vcpkg" checkout $env:VCPKG_BASELINE
          & "C:\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "C:\vcpkg\vcpkg.exe" version
          cmake --version
          cpack --version
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) { throw 'ANDROID_KEYSTORE_BASE64 is required' }
          New-Item -ItemType Directory -Force .android-keystore | Out-Null
          [IO.File]::WriteAllBytes('.android-keystore\aa-android-release-sign-keystore.jks', [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
      - name: Configure and build APK/AAB
        env:
          BUILD_ROOT: C:\b
          VCPKG_INSTALLED_ROOT: C:\vi
          VCPKG_BUILDTREES_ROOT: C:\vb
        run: |
          cmake --preset host-x64-windows-target-arm64-android-release
          cmake --build --preset host-x64-windows-target-arm64-android-release-build --target apk --parallel
          cmake --build --preset host-x64-windows-target-arm64-android-release-build --target aab --parallel
      - name: Align and sign release artifacts
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_PASSWORD)) { throw 'ANDROID_KEYSTORE_PASSWORD is required' }
          $build = "C:\b\host-x64-windows-target-arm64-android-release"
          cmake --build "$build" --config Release --target android_align_and_sign --parallel
      - name: Locate signed APK
        id: signedapk
        run: |
          $build = "C:\b\host-x64-windows-target-arm64-android-release"
          $signed = Get-ChildItem -Path $build -Directory -Recurse -Filter signed |
            Where-Object { $_.Parent.Name -eq 'android-build' } |
            Select-Object -First 1
          if (-not $signed) { throw "No android-build\signed directory found under $build" }
          Write-Output "Signed artifacts directory: $($signed.FullName)"
          Get-ChildItem -Path $signed.FullName -Recurse | ForEach-Object { Write-Output $_.FullName }
          $apk = Get-ChildItem -Path $signed.FullName -Filter '*-signed.apk' | Select-Object -First 1
          if (-not $apk) { throw "No signed .apk found under $($signed.FullName)" }
          Write-Output "Signed apk: $($apk.FullName)"
          "file=$($apk.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-arm64-android
          path: ${{ steps.signedapk.outputs.file }}
          if-no-files-found: error

  host-x64-windows-target-wasm32-emscripten:
    name: host-x64-windows-target-wasm32-emscripten
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Report MSVC compiler
        run: |
          $compiler = Get-Command cl.exe -ErrorAction Stop
          Write-Output "MSVC compiler: $($compiler.Source)"
          & $compiler.Source 2>&1 | Select-Object -First 2
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.7
          actions-cache-folder: emsdk-cache
      - name: Report Emscripten cross compiler
        run: |
          emcc --version
          em++ --version
      - name: Install vcpkg
        run: |
          # Short root-level path avoids MAX_PATH (260) failures deep in qtdeclarative's nested sources
          git clone https://github.com/microsoft/vcpkg.git "C:\vcpkg"
          git -C "C:\vcpkg" checkout $env:VCPKG_BASELINE
          & "C:\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EMSCRIPTEN_ROOT=$env:EMSDK\upstream\emscripten" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "C:\vcpkg\vcpkg.exe" version
          cmake --version
          cpack --version
      - name: Configure and build
        env:
          BUILD_ROOT: C:\b
          VCPKG_INSTALLED_ROOT: C:\vi
          VCPKG_BUILDTREES_ROOT: C:\vb
        run: |
          cmake --preset host-x64-windows-target-wasm32-emscripten-release
          cmake --build --preset host-x64-windows-target-wasm32-emscripten-release-build --parallel
          $build = "C:\b\host-x64-windows-target-wasm32-emscripten-release"
          cmake --install $build --config Release
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-wasm32-emscripten
          path: C:\b\host-x64-windows-target-wasm32-emscripten-release\install\bin\*
          if-no-files-found: error